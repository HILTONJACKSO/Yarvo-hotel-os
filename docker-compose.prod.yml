version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
#  Bella Casa / Kwalee Beach Resort — Production Docker Compose
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL 18 ──────────────────────────────────────────────────────────
  db:
    image: postgres:18-alpine
    container_name: bellacasa-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bellacasa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-BellaCasa@DB2026}
      POSTGRES_DB: ${POSTGRES_DB:-bellacasa}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bellacasa} -d ${POSTGRES_DB:-bellacasa}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - yarvo_net

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bellacasa-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-BellaCasa@Redis2026} --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-BellaCasa@Redis2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yarvo_net

  # ── API (NestJS) ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bellacasa-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - API_PORT=3001
      - API_HOST=0.0.0.0
      - FRONTEND_URL=${FRONTEND_URL:-https://kwaleebeachresort.com}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bellacasa}:${POSTGRES_PASSWORD:-BellaCasa@DB2026}@db:5432/${POSTGRES_DB:-bellacasa}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-bellacasa_jwt_secret_access_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-bellacasa_jwt_secret_refresh_2026}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - COOKIE_SECRET=${COOKIE_SECRET:-bellacasa_cookie_secret_2026}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-strict}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-.kwaleebeachresort.com}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://kwaleebeachresort.com,https://www.kwaleebeachresort.com}
      - PUBLIC_API_KEY=${PUBLIC_API_KEY:-yarvo_pub_prod_kwalee_7890abcdef}
      - RATE_LIMIT_TTL=60000
      - RATE_LIMIT_MAX=100
      - AUTH_RATE_LIMIT_TTL=900000
      - AUTH_RATE_LIMIT_MAX=5
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-BellaCasa@Redis2026}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - HOTEL_EMAIL=${HOTEL_EMAIL}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/uploads
    networks:
      - yarvo_net

  # ── Web (Next.js) ────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.kwaleebeachresort.com}
    container_name: bellacasa-web
    restart: always
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.kwaleebeachresort.com}
      - NEXT_PUBLIC_APP_NAME="Kwalee Beach Resort"
      - INTERNAL_API_URL=http://api:3001
      - PUBLIC_API_KEY=${PUBLIC_API_KEY:-yarvo_pub_prod_kwalee_7890abcdef}
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/apps/web/public/uploads
    networks:
      - yarvo_net

volumes:
  postgres_data:
    name: bellacasa_bellacasa_postgres_data
  redis_data:
    name: bellacasa_bellacasa_redis_data
  uploads:
    name: bellacasa_bellacasa_uploads

networks:
  yarvo_net:
    driver: bridge
