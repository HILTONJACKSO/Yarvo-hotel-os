version: '3.9'

# =============================================================================
# Bella Casa HMS — Local Development Services
# =============================================================================
# NOTE: Docker Desktop is required to run this file.
# Install from: https://www.docker.com/products/docker-desktop/
#
# Usage:
#   docker compose up -d       — Start all services
#   docker compose down        — Stop all services
#   docker compose logs -f db  — Follow database logs
# =============================================================================

services:
  # ─── PostgreSQL 18 ──────────────────────────────────────────────────────────
  db:
    image: postgres:18-alpine
    container_name: bellacasa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bellacasa
      POSTGRES_PASSWORD: BellaCasa@DB2026
      POSTGRES_DB: bellacasa
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - bellacasa_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bellacasa -d bellacasa"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── PostgreSQL Test Instance ─────────────────────────────────────────────
  db-test:
    image: postgres:18-alpine
    container_name: bellacasa-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: bellacasa
      POSTGRES_PASSWORD: BellaCasa@DB2026
      POSTGRES_DB: bellacasa_test
    ports:
      - "5434:5432"
    volumes:
      - bellacasa_postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bellacasa -d bellacasa_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bellacasa-redis
    restart: unless-stopped
    command: redis-server --requirepass BellaCasa@Redis2026 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - bellacasa_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "BellaCasa@Redis2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bellacasa_postgres_data:
    name: bellacasa_postgres_data
  bellacasa_postgres_test_data:
    name: bellacasa_postgres_test_data
  bellacasa_redis_data:
    name: bellacasa_redis_data
